<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>—</title>
<style>

:root{
  --bg:#0f1115; --bg2:#171a21; --bg3:#1e222b;
  --fg:#e8eaf0; --dim:#9aa3b2; --line:#2a2f3a;
  --accent:#e8734a; --accent2:#f2b544; --moon:#8fb7f5; --ok:#5fbf8f;
  --r:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#faf9f7; --bg2:#fff; --bg3:#f2f0ec; --fg:#1c1e24; --dim:#6b7280; --line:#e4e2dd; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.65; font-size:15px; padding-bottom:60px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* hero */
header{padding:34px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}
.kicker{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700;text-transform:uppercase}
h1{font-size:29px;margin:8px 0 6px;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--dim);font-size:14px}
.flights{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.fl{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fl .t{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-bottom:4px}
.fl .m{font-size:16px;font-weight:700;letter-spacing:-.01em}
.fl .s{font-size:12px;color:var(--dim);margin-top:2px}
@media(max-width:520px){.flights{grid-template-columns:1fr}h1{font-size:24px}}

/* alert */
.alert{background:linear-gradient(135deg,rgba(232,115,74,.13),rgba(242,181,68,.08));
  border:1px solid rgba(232,115,74,.35);border-radius:var(--r);padding:14px 16px;margin:18px 0}
.alert b{color:var(--accent)}
.alert .h{font-weight:700;margin-bottom:4px}

/* day grid */
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 8px}
.staygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 4px}
.stay{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.stay .when{font-size:13px;color:var(--dim)}.stay b{display:block;color:var(--fg);font-size:15px}
.stay a{flex:0 0 auto;text-decoration:none;background:var(--fg);color:var(--bg);padding:8px 11px;
  border-radius:9px;font-size:13px;font-weight:700}
@media(max-width:560px){.staygrid{grid-template-columns:1fr}}
.dg{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.dg .d{font-size:19px;font-weight:800;letter-spacing:-.02em}
.dg .w{font-size:11px;color:var(--dim);margin-top:1px}
.dg .tag{font-size:10px;margin-top:6px;padding:2px 6px;border-radius:20px;display:inline-block;font-weight:700}
.dg.hol{border-color:rgba(232,115,74,.45)}
.dg.hol .tag{background:rgba(232,115,74,.2);color:var(--accent)}
.dg.good{border-color:rgba(95,191,143,.45)}
.dg.good .tag{background:rgba(95,191,143,.16);color:var(--ok)}
.dg.moon{border-color:rgba(143,183,245,.5)}
.dg.moon .tag{background:rgba(143,183,245,.16);color:var(--moon)}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:4px;overflow-x:auto;padding:8px 0;margin:24px 0 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--dim);
  padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

section[hidden]{display:none}
section{padding-top:22px}
h2{font-size:20px;margin:26px 0 12px;letter-spacing:-.015em}
h2:first-child{margin-top:6px}
h3{font-size:15px;margin:22px 0 9px;color:var(--dim);letter-spacing:.02em;font-weight:700}

/* timeline */
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:0}
.tl li{list-style:none;position:relative;padding:0 0 16px 20px}
.tl li::before{content:"";position:absolute;left:-6px;top:8px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line)}
.tl li.key::before{background:var(--accent);border-color:var(--accent)}
.tl .time{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.03em}
.tl .what{margin-top:1px}
.tl .note{font-size:13px;color:var(--dim);margin-top:2px}

/* cards */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.card.star{border-color:rgba(242,181,68,.45);background:linear-gradient(135deg,rgba(242,181,68,.07),transparent)}
.card.moonc{border-color:rgba(143,183,245,.4);background:linear-gradient(135deg,rgba(143,183,245,.08),transparent)}
.card .ttl{font-weight:800;font-size:15px;letter-spacing:-.01em}
.card .meta{font-size:12.5px;color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.card .meta span{white-space:nowrap}
.card .body{font-size:14px;margin-top:8px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;
  background:var(--bg3);color:var(--dim);margin-right:6px;vertical-align:2px;letter-spacing:.03em}
.pill.free{background:rgba(95,191,143,.16);color:var(--ok)}
.pill.only{background:rgba(232,115,74,.18);color:var(--accent)}
.pill.new{background:rgba(143,183,245,.16);color:var(--moon)}

/* expandable card */
details.card{padding:0}
details.card > summary{list-style:none;cursor:pointer;padding:14px 40px 14px 16px;position:relative;border-radius:var(--r)}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{
  content:"";position:absolute;right:16px;top:19px;width:9px;height:9px;
  border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
  transform:rotate(45deg);transition:transform .18s}
details.card[open] > summary::after{transform:rotate(-135deg);top:23px}
details.card > summary:hover::after{border-color:var(--accent)}
details.card .more{padding:0 16px 16px;margin-top:-2px}
details.card .more .inner{border-top:1px dashed var(--line);padding-top:12px}
.more dl{margin:0}
.more dt{font-weight:800;font-size:11px;color:var(--accent);letter-spacing:.08em;margin-top:12px}
.more dt:first-child{margin-top:0}
.more dd{margin:3px 0 0;font-size:13.5px}
.more ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.more li{margin-bottom:3px}
.hint{font-size:12px;color:var(--dim);margin:4px 0 12px}
.hint b{color:var(--accent)}

/* split routes */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.split{grid-template-columns:1fr}}
.split .card{margin:0}

/* table */
.tw{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--dim);letter-spacing:.06em;font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td b{font-weight:700}

/* checklist */
.ck{list-style:none;padding:0;margin:8px 0}
.ck li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ck input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto}
.ck label{flex:1;cursor:pointer}
.ck .due{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.03em}
.ck input:checked + label{opacity:.4;text-decoration:line-through}

/* misc */
.muted{color:var(--dim);font-size:13.5px}
.warn{border-left:3px solid var(--accent);padding-left:12px;margin:14px 0;font-size:13.5px;color:var(--dim)}
.warn b{color:var(--fg)}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
footer a{color:var(--dim)}
footer li{margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
.stat .n{font-size:24px;font-weight:800;letter-spacing:-.03em}
.stat .l{font-size:11.5px;color:var(--dim);margin-top:2px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
@media(max-width:520px){.statgrid{grid-template-columns:repeat(2,1fr)}}

/* visual trip plan */
.visual-plan{margin:28px 0 30px}
.visual-plan .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--accent);text-transform:uppercase}
.visual-plan h2{font-size:24px;margin:5px 0 5px}
.visual-plan>.lead{margin:0 0 14px;color:var(--dim);font-size:13.5px}
.storygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.story{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--bg2);margin:0;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.story.wide{grid-column:1/-1}
.story-media{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg3)}
.story-media.duo{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.story-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.story:hover .story-media img{transform:scale(1.018)}
.story-shade{position:absolute;inset:auto 0 0;padding:42px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.74));color:#fff;pointer-events:none}
.story-shade .date{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.88}
.story-shade .name{font-size:20px;font-weight:900;line-height:1.15;margin-top:3px;letter-spacing:-.02em}
.story-body{padding:14px 15px 15px}
.story-body .mood{font-size:14px;font-weight:800;margin-bottom:8px}
.route{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:6px 0 11px}
.route span{font-size:11.5px;background:var(--bg3);border:1px solid var(--line);padding:4px 8px;border-radius:999px;white-space:nowrap}
.route i{font-style:normal;color:var(--dim);font-size:11px}
.beats{display:grid;gap:7px}
.beat{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:13px;align-items:start}
.beat time{font-size:11px;font-weight:900;color:var(--accent);padding-top:2px}
.beat b{font-size:13px}
.story-note{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim)}
.story-note strong{color:var(--fg)}
.photo-credit{display:block;margin-top:9px;font-size:10px;color:var(--dim);text-decoration:none;opacity:.78}
.photo-credit:hover{opacity:1;text-decoration:underline}
.plan-key{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.plan-key span{font-size:11px;color:var(--dim)}
.plan-key b{color:var(--fg)}
@media(max-width:680px){
  .storygrid{grid-template-columns:1fr}
  .story.wide{grid-column:auto}
  .visual-plan h2{font-size:21px}
  .story-shade .name{font-size:18px}
}
@media(max-width:430px){.story-media.duo{grid-template-columns:1fr 1fr}.beat{grid-template-columns:48px 1fr}}

/* lock screen */
#lock{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:20px}
#lockbox{max-width:340px;width:100%;text-align:center}
#lockbox .ic{font-size:40px;line-height:1;margin-bottom:14px}
#lockbox h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
#lockbox p{color:var(--dim);font-size:13px;margin:0 0 20px}
#pw{width:100%;padding:13px 15px;font-size:16px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg2);color:var(--fg);
  font-family:inherit;text-align:center;letter-spacing:.1em}
#pw:focus{outline:none;border-color:var(--accent)}
#go{width:100%;margin-top:9px;padding:13px;font-size:15px;font-weight:700;border:none;
  border-radius:11px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
#go:disabled{opacity:.5;cursor:default}
#err{color:var(--accent);font-size:13px;min-height:20px;margin-top:11px;font-weight:600}
</style>
</head>
<body>

<div id="lock">
  <div id="lockbox">
    <div class="ic">🌑</div>
    <h1>잠금</h1>
    <p>비밀번호를 입력하세요</p>
    <form id="f">
      <input id="pw" type="password" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" inputmode="text">
      <button id="go" type="submit">열기</button>
    </form>
    <div id="err"></div>
  </div>
</div>

      pw=document.getElementById('pw'), go=document.getElementById('go'),
      err=document.getElementById('err'), f=document.getElementById('f');

  function b64(s){var b=atob(s),a=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}

  async function unlock(pass){
    var raw=b64(document.getElementById('payload').textContent.trim());
    var salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),
            {name:'PBKDF2'},false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
    return new TextDecoder().decode(plain);
  }

  function initTabs(){
    var tabs=document.querySelectorAll('nav.tabs button');
    var secs=document.querySelectorAll('section[id]');
    tabs.forEach(function(b){
      b.addEventListener('click',function(){
        var keepX=window.scrollX, keepY=window.scrollY;
        tabs.forEach(function(x){x.setAttribute('aria-selected','false');});
        b.setAttribute('aria-selected','true');
        secs.forEach(function(s){s.hidden=(s.id!==b.dataset.t);});
        window.scrollTo(keepX,keepY);
      });
    });
  }

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent=''; go.disabled=true; go.textContent='여는 중…';
    try{
      var html=await unlock(pw.value);
      app.innerHTML=html; app.hidden=false; lock.remove();
      document.title='2026 추석 도쿄 · 9/23–26';
      initTabs();
    }catch(_){
      err.textContent='비밀번호가 틀립니다';
      go.disabled=false; go.textContent='열기';
      pw.value=''; pw.focus();
    }
  });
  pw.focus();
})();
</script>
</body>
</html>
